name: binance-rebalance-bot

# ----------------------------------------------------------------------------
# Reusable defaults — every trading service inherits from this anchor so the
# build, env, volumes, and restart policy stay in one place.
#
# Usage cheatsheet
#   docker compose --profile dashboard up -d                  # web UI on :5000
#   docker compose --profile demo      up -d                  # demo UI on :5001
#
#   # Single-coin (paper / testnet)
#   docker compose --profile paper-btc up -d
#   docker compose --profile paper-eth up -d
#   docker compose --profile paper-dcr up -d
#   docker compose --profile paper-zec up -d
#   docker compose --profile paper-bnb up -d
#
#   # Single-coin (live / real funds — USE WITH CAUTION)
#   docker compose --profile live-btc  up -d
#   docker compose --profile live-eth  up -d
#   docker compose --profile live-dcr  up -d
#   docker compose --profile live-zec  up -d
#   docker compose --profile live-bnb  up -d
#
#   # Multi-coin baskets (all enabled strategies in one container)
#   docker compose --profile paper-basket up -d
#   docker compose --profile live-basket  up -d
#
#   # Custom basket — pass STRATEGIES via env (space-separated names without .json)
#   STRATEGIES="btc_conservative eth_balanced" \
#       docker compose --profile paper-custom up -d
#
#   # Backtest (one-off)
#   docker compose --profile backtest run --rm backtest \
#       --strategies btc_conservative --days 30
# ----------------------------------------------------------------------------

x-bot-base: &bot-base
  build: .
  env_file:
    - .env
  volumes:
    - ./logs:/app/logs
    - ./data:/app/data
    - ./charts_output:/app/charts_output
    - ./config:/app/config:ro
  restart: unless-stopped

services:
  # ==========================================================================
  # Web Dashboard
  # ==========================================================================
  dashboard:
    <<: *bot-base
    container_name: binance-dashboard
    ports:
      - "${DASHBOARD_PORT:-5000}:5000"
    profiles: ["dashboard"]
    command: ["python", "main.py", "--mode", "dashboard", "--port", "5000"]

  dashboard-demo:
    <<: *bot-base
    container_name: binance-dashboard-demo
    ports:
      - "${DEMO_PORT:-5001}:5000"
    profiles: ["demo"]
    command: ["python", "main.py", "--mode", "dashboard", "--demo", "--port", "5000"]

  # ==========================================================================
  # Single-coin — Paper trading (testnet, no real money)
  # ==========================================================================
  paper-btc:
    <<: *bot-base
    container_name: binance-paper-btc
    profiles: ["paper-btc"]
    command: ["python", "main.py", "--mode", "paper", "--strategies", "btc_conservative"]

  paper-eth:
    <<: *bot-base
    container_name: binance-paper-eth
    profiles: ["paper-eth"]
    command: ["python", "main.py", "--mode", "paper", "--strategies", "eth_balanced"]

  paper-bnb:
    <<: *bot-base
    container_name: binance-paper-bnb
    profiles: ["paper-bnb"]
    command: ["python", "main.py", "--mode", "paper", "--strategies", "bnb_aggressive"]

  paper-dcr:
    <<: *bot-base
    container_name: binance-paper-dcr
    profiles: ["paper-dcr"]
    command: ["python", "main.py", "--mode", "paper", "--strategies", "dcr_balanced"]

  paper-zec:
    <<: *bot-base
    container_name: binance-paper-zec
    profiles: ["paper-zec"]
    command: ["python", "main.py", "--mode", "paper", "--strategies", "zec_balanced"]

  # ==========================================================================
  # Single-coin — Live trading (REAL MONEY)
  # ==========================================================================
  live-btc:
    <<: *bot-base
    container_name: binance-live-btc
    profiles: ["live-btc"]
    command: ["python", "main.py", "--mode", "live", "--strategies", "btc_conservative"]

  live-eth:
    <<: *bot-base
    container_name: binance-live-eth
    profiles: ["live-eth"]
    command: ["python", "main.py", "--mode", "live", "--strategies", "eth_balanced"]

  live-bnb:
    <<: *bot-base
    container_name: binance-live-bnb
    profiles: ["live-bnb"]
    command: ["python", "main.py", "--mode", "live", "--strategies", "bnb_aggressive"]

  live-dcr:
    <<: *bot-base
    container_name: binance-live-dcr
    profiles: ["live-dcr"]
    command: ["python", "main.py", "--mode", "live", "--strategies", "dcr_balanced"]

  live-zec:
    <<: *bot-base
    container_name: binance-live-zec
    profiles: ["live-zec"]
    command: ["python", "main.py", "--mode", "live", "--strategies", "zec_balanced"]

  # ==========================================================================
  # Multi-coin baskets — all enabled strategies in one container
  # ==========================================================================
  paper-basket:
    <<: *bot-base
    container_name: binance-paper-basket
    profiles: ["paper-basket"]
    command: ["python", "main.py", "--mode", "paper", "--strategies", "all"]

  live-basket:
    <<: *bot-base
    container_name: binance-live-basket
    profiles: ["live-basket"]
    command: ["python", "main.py", "--mode", "live", "--strategies", "all"]

  # Custom basket — choose your own strategy list via STRATEGIES env var.
  # Example: STRATEGIES="btc_conservative eth_balanced dcr_balanced"
  paper-custom:
    <<: *bot-base
    container_name: binance-paper-custom
    profiles: ["paper-custom"]
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec python main.py --mode paper --strategies ${STRATEGIES:-all}']

  live-custom:
    <<: *bot-base
    container_name: binance-live-custom
    profiles: ["live-custom"]
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec python main.py --mode live --strategies ${STRATEGIES:-all}']

  # ==========================================================================
  # Backtest — one-off runner. Pass extra args after `run --rm backtest`.
  #   docker compose --profile backtest run --rm backtest \
  #       --strategies btc_conservative --days 30
  # ==========================================================================
  backtest:
    <<: *bot-base
    container_name: binance-backtest
    restart: "no"
    profiles: ["backtest"]
    entrypoint: ["python", "main.py", "--mode", "backtest"]
